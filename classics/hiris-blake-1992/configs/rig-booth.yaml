# A behavioural booth: a display, a keyboard, no other devices. EXAMPLE GEOMETRY ONLY.
# Measure your own panel and viewing distance and enter them here before a real session;
# `uv run alhazen calibrate ruler --rig booth` checks them with a tape measure.
# A white background of 15 cd/m2 (the paper's) needs a photometer: alhazen does not set luminance.
# Add devices (eyetracker, reward, sync) inside `devices:` as alhazen's docs/rigs.md shows.
monitor:
  name: booth
  width_px: 1920
  height_px: 1080
  width_cm: 53.0
  distance_cm: 114.0  # the paper's viewing distance (p. 9025): 2-arcmin dots are then ~2.4 px on this panel
  refresh_rate_hz: 60.0
  fullscreen: true
display:
  backend: psychopy
  frame_qa:
    policy: recycle_trial
    max_dropped_fraction: 0.10
live_monitor:
  enabled: true
  auto_open: true
  port: 0
devices: {}
data_root: data
real_data: true
