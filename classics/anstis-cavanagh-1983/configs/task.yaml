# Experiment 1, red/green: minimum motion by the method of constant stimuli (human).
# Anstis & Cavanagh (1983), pp. 155-157 and Fig. 1-2. Values the paper states cite it
# ("# paper: p. N"); values it does not are "# ASSUMED (not in the paper): <reason>" and are
# listed in docs/methods.md. cd/m2 are physical only with a measured photometry file.
subject_kind: human
patch_size_dva: 2.0           # paper: p. 157 ("2 deg x 2 deg in a dark surround")
fixation:                     # paper: p. 157 ("a white cross on a blue 6-min square")
  square_arcmin: 6.0          # paper: p. 157
  cross_arcmin: 6.0           # ASSUMED (not in the paper): cross arms span the square
  line_arcmin: 1.0            # ASSUMED (not in the paper): cross line width
photometry_file: photometry-booth.yaml   # rig-specific; the example file is NOT a measurement
display_calibration: calibrated          # real data refused unless the photometry is measured
snap_period_to_pixels: true   # ASSUMED (not in the paper): period a multiple of 4 px so each step is exactly 1/4 cycle
fixation_duration: {ms: 500}  # ASSUMED (not in the paper): fixation mark alone before the cycle starts
iti: {ms: 500}                # ASSUMED (not in the paper): dark interval between trials
test_colour: red              # paper: p. 157 (red bars varied)
reference_colour: green       # paper: p. 157
reference_cd_m2: 13.4         # paper: p. 157 ("green bars were held constant at 13.4 cd m-2")
spatial_freq_cpd: 2.5         # paper: p. 157 (square-wave, 2.5 cycles/deg)
cycle_hz: 5.0                 # paper: p. 157 ("alternated at 5 Hz in a four-stroke cycle"; read as 5 cycles/s, 3 frames per grating at 60 Hz)
interleave_contrast: 0.0625   # paper: p. 157 ("the contrast of the yellow grating was 6.25%")
interleave_mix: additive      # ASSUMED (not in the paper): additive mean of the two colours instead of the paper's raster-line dither (p. 156); line_dither is available
dither_rows: 2                # paper: p. 156 ("pairs of the 512 horizontal raster lines"); used only with line_dither
test_levels_cd_m2: [8.0, 8.25, 8.5, 8.75, 9.0, 9.25, 9.5, 9.75, 10.0, 10.25, 10.5, 10.75, 11.0, 11.25, 11.5, 11.75, 12.0]  # ASSUMED (not in the paper): the paper gives the range 8-12 cd/m2 (p. 157); 0.25 spacing read from Fig. 2
response_timeout: {ms: 10000} # ASSUMED (not in the paper): the cycle runs until a key or 10 s
paradigm:
  kind: constant
  n_per_condition: 5          # paper: p. 157 (each level ten times = 5 rightward-step + 5 leftward-step trials here)
