# Experiment 2, minimum motion vs spatial frequency, by adjustment (human).
# Anstis & Cavanagh (1983), pp. 157-159 and Fig. 3.
subject_kind: human
patch_size_dva: 2.0           # paper: p. 157 ("2 deg x 2 deg in a dark surround")
fixation:                     # paper: p. 157 ("a white cross on a blue 6-min square")
  square_arcmin: 6.0          # paper: p. 157
  cross_arcmin: 6.0           # ASSUMED (not in the paper): cross arms span the square
  line_arcmin: 1.0            # ASSUMED (not in the paper): cross line width
photometry_file: photometry-booth.yaml   # rig-specific; the example file is NOT a measurement
display_calibration: calibrated          # real data refused unless the photometry is measured
snap_period_to_pixels: true   # ASSUMED (not in the paper): period a multiple of 4 px so each step is exactly 1/4 cycle
fixation_duration: {ms: 500}  # ASSUMED (not in the paper): fixation mark alone before the cycle starts
iti: {ms: 500}                # ASSUMED (not in the paper): dark interval between trials
reference_colour: grey        # paper: p. 159 (achromatic grey; here the display's own white point)
reference_cd_m2: 13.6         # paper: p. 159 ("the grey bars had a luminance of 13.6 cd m-2")
test_colours: [red, green, blue]  # paper: p. 159
start_range: [0.7, 1.3]       # ASSUMED (not in the paper): each setting starts at a random luminance 0.7-1.3 x the reference (log-uniform)
step_factor: 1.01             # ASSUMED (not in the paper): one wheel notch or arrow press = 1% of the test luminance (the paper used a joystick)
limits: [0.25, 4.0]           # ASSUMED (not in the paper): knob range, x reference, capped by the display
adjust_timeout: {ms: 60000}   # ASSUMED (not in the paper): a setting not committed in 60 s is served again
spatial_freqs_cpd: [0.625, 1.25, 2.5, 5.0]  # paper: p. 157
rates_hz: [15.0]              # paper: p. 159 ("the cycling rate was 15 Hz ... a single TV frame")
interleave_contrast: 0.125    # paper: p. 159 (pink grating "luminance contrast of 12.5%")
interleave_mix: additive      # ASSUMED (not in the paper): "equal parts of the red and the achromatic grey" (p. 159) drawn as their additive mean
dither_rows: 2                # used only with line_dither
paradigm:
  kind: adjustment
  n_per_condition: 3          # paper: p. 159 (six readings per datum = 3 per step direction here)
