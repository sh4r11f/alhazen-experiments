# A behavioural booth: a display, a keyboard, no other devices. EXAMPLE GEOMETRY ONLY.
# Measure your own panel and viewing distance and enter them here before a real session;
# `uv run alhazen calibrate ruler --rig booth` checks them with a tape measure.
# This rig runs the keyboard-only set: --params configs/task-keyboard.yaml
monitor:
  name: booth
  width_px: 1920
  height_px: 1080
  width_cm: 53.0
  distance_cm: 57.0
  refresh_rate_hz: 60.0
  fullscreen: true
display:
  backend: psychopy
  feedback_beeps: false          # ASSUMED (not in the paper): no feedback tone is mentioned; feedback is visual only
  frame_qa:
    policy: recycle_trial
    max_dropped_fraction: 0.10
live_monitor:
  enabled: true
  auto_open: true
  port: 0
devices: {}
data_root: data
real_data: true
