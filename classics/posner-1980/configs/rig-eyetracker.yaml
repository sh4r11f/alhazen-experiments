# A booth with an EyeLink: what the eye-tracker set (configs/task.yaml) needs. EXAMPLE GEOMETRY
# ONLY. Measure your own panel and viewing distance before a real session
# (`uv run alhazen calibrate ruler --rig eyetracker`). 100.1.1.1 is the EyeLink Host PC's
# factory address on its own subnet; change it if yours differs. alhazen's docs/rigs.md and
# docs/eye-tracker.md describe every field.
monitor:
  name: eyetracker
  width_px: 1920
  height_px: 1080
  width_cm: 53.0
  distance_cm: 57.0
  refresh_rate_hz: 60.0
  fullscreen: true
display:
  backend: psychopy
  feedback_beeps: false          # ASSUMED (not in the paper): no feedback tone is mentioned; feedback is visual only
  frame_qa:
    policy: recycle_trial
    max_dropped_fraction: 0.10
live_monitor:
  enabled: true
  auto_open: true
  port: 0
devices:
  eyetracker:
    backend: eyelink
    host_ip: 100.1.1.1
    calibration_type: HV5
    edf_host_filename: posner.EDF
data_root: data
real_data: true
