# A human booth with a video eye tracker. EXAMPLE GEOMETRY ONLY: measure your own panel and
# viewing distance and enter them before a real session (`uv run alhazen calibrate ruler
# --rig booth` checks them with a tape measure). The task needs every cue, 13 deg from the
# centre, on the screen: this example reaches about 25 x 15 deg either side of centre, and a
# screen that cannot show the cues is refused when the first trial is built.
monitor:
  name: booth
  width_px: 1920
  height_px: 1080
  width_cm: 53.0
  distance_cm: 57.0
  refresh_rate_hz: 60.0
  fullscreen: true
display:
  backend: psychopy
  frame_qa:
    policy: recycle_trial
    max_dropped_fraction: 0.10
live_monitor:
  enabled: true
  auto_open: true
  port: 0
devices:
  eyetracker:
    backend: eyelink
    host_ip: 100.1.1.1         # the EyeLink default address
    calibration_type: HV9
    calibration_area: 0.8      # the cues sit 13 deg out: calibrate past them
data_root: data
real_data: true
