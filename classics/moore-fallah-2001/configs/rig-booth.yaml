# A behavioural booth for the HUMAN parameter set: a display, a keyboard and an
# eye tracker (the task is gaze-contingent: fixation must stay inside its
# window for the whole trial). EXAMPLE GEOMETRY AND DEVICES ONLY. Measure your
# own panel and viewing distance and enter them here before a real session;
# `uv run alhazen calibrate ruler --rig booth` checks them with a tape measure,
# and `uv run alhazen calibrate gamma --rig booth` stores the display gamma the
# task's photometry block assumes (docs/methods.md, Apparatus).
#
# The paper's monitor was 40 x 30 cm at about 57 cm (±19.3° x ±14.7°, p. 1273).
# The movement-field locations in configs/*.yaml must fit on THIS screen; the
# task refuses a target that does not.
monitor:
  name: booth
  width_px: 1920
  height_px: 1080
  width_cm: 53.0
  distance_cm: 57.0
  refresh_rate_hz: 60.0
  fullscreen: true
display:
  backend: psychopy
  frame_qa:
    policy: recycle_trial
    max_dropped_fraction: 0.10
  feedback_beeps: false
live_monitor:
  enabled: true
  auto_open: true
  port: 0
devices:
  eyetracker:
    backend: eyelink
    host_ip: 100.1.1.1          # the EyeLink default address
    edf_host_filename: mf2001.EDF
    calibration_type: HV9
data_root: data
real_data: true
