# A behavioural booth for the HUMAN set (configs/task.yaml): a display, a keyboard, no other
# devices. EXAMPLE GEOMETRY ONLY.
# Measure your own panel and viewing distance and enter them here before a real session;
# `uv run alhazen calibrate ruler --rig booth` checks them with a tape measure.
# Add devices (eyetracker, reward, sync) inside `devices:` as alhazen's docs/rigs.md shows.
monitor:
  name: booth
  width_px: 1920
  height_px: 1080
  width_cm: 53.0
  distance_cm: 57.0
  refresh_rate_hz: 60.0
  fullscreen: true
display:
  backend: psychopy
  feedback_beeps: false   # ASSUMED (not in the paper): the human set's feedback is the fixation point's colour only
  frame_qa:
    policy: recycle_trial
    max_dropped_fraction: 0.10
live_monitor:
  enabled: true
  auto_open: true
  port: 0
devices: {}
data_root: data
real_data: true
