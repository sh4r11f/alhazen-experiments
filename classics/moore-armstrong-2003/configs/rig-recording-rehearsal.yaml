# rig-recording-example.yaml with every device stood down: for rehearsing a whole
# stimulation session (and `alhazen check-rig --rig recording-rehearsal --pulse`) on any
# computer. Same monitor, same event lines; nothing is driven, nothing is recorded.
# What a clean run here proves about the rig: nothing. No stimulator was triggered, no
# line reached a recorder, no eye was tracked.
monitor:
  name: recording-rehearsal
  width_px: 1024
  height_px: 768
  width_cm: 40.0
  distance_cm: 57.0
  refresh_rate_hz: 60.0
  fullscreen: false
display:
  backend: simulated
  frame_qa:
    policy: mark_trial
live_monitor:
  enabled: true
  auto_open: false
  port: 0
devices:
  eyetracker:
    backend: mouse_sim
  reward:
    backend: simulated
    device: Dev1
    channel: ao0
    voltage: 5.0
  sync:
    backend: simulated
    pulse_ms: 2.0
    event_lines:
      TRIAL_START: Dev1/port0/line0
      VIS_ON: Dev1/port0/line1
      STIM_TRIGGER: Dev1/port0/line2
      CONTROL_MARK: Dev1/port0/line3
data_root: data
real_data: false
